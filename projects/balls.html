<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spinning Hexagon with Bouncing Ball</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 20px;
      }

      h1 {
        color: white;
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .subtitle {
        color: rgba(255, 255, 255, 0.8);
        font-size: 1.1rem;
        margin-bottom: 30px;
      }

      #canvas {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        background: rgba(0, 0, 0, 0.1);
      }

      .controls {
        margin-top: 30px;
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .control-group {
        background: rgba(255, 255, 255, 0.1);
        padding: 15px 20px;
        border-radius: 10px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .control-group label {
        color: white;
        display: block;
        margin-bottom: 5px;
        font-size: 0.9rem;
      }

      .control-group input[type="range"] {
        width: 150px;
        height: 6px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
        outline: none;
        -webkit-appearance: none;
      }

      .control-group input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .control-group input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
      }

      .control-group span {
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.85rem;
        margin-left: 10px;
      }

      button {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.3);
        padding: 10px 20px;
        border-radius: 25px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        backdrop-filter: blur(10px);
      }

      button:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      button:active {
        transform: translateY(0);
      }

      .info {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.3);
        color: white;
        padding: 15px;
        border-radius: 10px;
        backdrop-filter: blur(10px);
        font-size: 0.9rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Spinning Hexagon Physics</h1>
      <p class="subtitle">Watch the ball bounce inside the rotating hexagon</p>

      <canvas id="canvas" width="600" height="600"></canvas>

      <div class="controls">
        <div class="control-group">
          <label for="rotationSpeed">Rotation Speed</label>
          <input
            type="range"
            id="rotationSpeed"
            min="0"
            max="5"
            step="0.1"
            value="1"
          />
          <span id="rotationValue">1.0</span>
        </div>

        <div class="control-group">
          <label for="gravity">Gravity</label>
          <input
            type="range"
            id="gravity"
            min="0"
            max="1"
            step="0.05"
            value="0.3"
          />
          <span id="gravityValue">0.30</span>
        </div>

        <div class="control-group">
          <label for="bounce">Bounce Factor</label>
          <input
            type="range"
            id="bounce"
            min="0.1"
            max="1"
            step="0.05"
            value="0.8"
          />
          <span id="bounceValue">0.80</span>
        </div>

        <button id="resetBtn">Reset Ball</button>
      </div>
    </div>

    <div class="info">
      <strong>Physics Features:</strong><br />
      • Realistic gravity<br />
      • Elastic collisions<br />
      • Rotation effects<br />
      • Energy conservation
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // Physics variables
      let rotationSpeed = 1;
      let gravity = 0.3;
      let bounceFactor = 0.8;
      let hexagonRotation = 0;

      // Ball properties
      const ball = {
        x: centerX,
        y: centerY - 100,
        vx: 2,
        vy: 0,
        radius: 15,
        color: "#FFD700",
        trail: [],
      };

      // Hexagon properties
      const hexagon = {
        radius: 200,
        sides: 6,
      };

      // Get hexagon vertices
      function getHexagonVertices(rotation) {
        const vertices = [];
        for (let i = 0; i < hexagon.sides; i++) {
          const angle = ((Math.PI * 2) / hexagon.sides) * i + rotation;
          vertices.push({
            x: centerX + Math.cos(angle) * hexagon.radius,
            y: centerY + Math.sin(angle) * hexagon.radius,
          });
        }
        return vertices;
      }

      // Check collision between ball and hexagon edge
      function checkCollision(vertices) {
        for (let i = 0; i < vertices.length; i++) {
          const v1 = vertices[i];
          const v2 = vertices[(i + 1) % vertices.length];

          // Calculate distance from ball to line segment
          const edge = {
            x1: v1.x,
            y1: v1.y,
            x2: v2.x,
            y2: v2.y,
          };

          const dist = distanceToLineSegment(ball.x, ball.y, edge);

          if (dist < ball.radius) {
            // Calculate normal vector
            const dx = edge.x2 - edge.x1;
            const dy = edge.y2 - edge.y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            const nx = -dy / len;
            const ny = dx / len;

            // Make sure normal points inward
            const midX = (edge.x1 + edge.x2) / 2;
            const midY = (edge.y1 + edge.y2) / 2;
            const toCenterX = centerX - midX;
            const toCenterY = centerY - midY;

            if (nx * toCenterX + ny * toCenterY < 0) {
              nx = -nx;
              ny = -ny;
            }

            // Reflect velocity
            const dot = ball.vx * nx + ball.vy * ny;
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;

            // Apply bounce factor
            ball.vx *= bounceFactor;
            ball.vy *= bounceFactor;

            // Push ball away from wall
            const overlap = ball.radius - dist;
            ball.x += nx * overlap;
            ball.y += ny * overlap;

            // Add rotation effect
            const rotEffect = rotationSpeed * 0.1;
            ball.vx += -ny * rotEffect;
            ball.vy += nx * rotEffect;
          }
        }
      }

      // Distance from point to line segment
      function distanceToLineSegment(px, py, edge) {
        const dx = edge.x2 - edge.x1;
        const dy = edge.y2 - edge.y1;
        const len2 = dx * dx + dy * dy;

        if (len2 === 0) {
          return Math.sqrt((px - edge.x1) ** 2 + (py - edge.y1) ** 2);
        }

        let t = ((px - edge.x1) * dx + (py - edge.y1) * dy) / len2;
        t = Math.max(0, Math.min(1, t));

        const projX = edge.x1 + t * dx;
        const projY = edge.y1 + t * dy;

        return Math.sqrt((px - projX) ** 2 + (py - projY) ** 2);
      }

      // Update ball physics
      function updateBall() {
        // Apply gravity
        ball.vy += gravity;

        // Apply rotation effect (centrifugal force)
        const distFromCenter = Math.sqrt(
          (ball.x - centerX) ** 2 + (ball.y - centerY) ** 2
        );
        const angle = Math.atan2(ball.y - centerY, ball.x - centerX);
        const centrifugalForce =
          rotationSpeed * rotationSpeed * distFromCenter * 0.001;

        ball.vx += Math.cos(angle) * centrifugalForce;
        ball.vy += Math.sin(angle) * centrifugalForce;

        // Update position
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Add to trail
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 20) {
          ball.trail.shift();
        }

        // Check collisions
        const vertices = getHexagonVertices(hexagonRotation);
        checkCollision(vertices);
      }

      // Draw hexagon
      function drawHexagon() {
        const vertices = getHexagonVertices(hexagonRotation);

        ctx.beginPath();
        ctx.moveTo(vertices[0].x, vertices[0].y);
        for (let i = 1; i < vertices.length; i++) {
          ctx.lineTo(vertices[i].x, vertices[i].y);
        }
        ctx.closePath();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
        ctx.fill();
      }

      // Draw ball
      function drawBall() {
        // Draw trail
        ctx.strokeStyle = "rgba(255, 215, 0, 0.3)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < ball.trail.length; i++) {
          if (i === 0) {
            ctx.moveTo(ball.trail[i].x, ball.trail[i].y);
          } else {
            ctx.lineTo(ball.trail[i].x, ball.trail[i].y);
          }
        }
        ctx.stroke();

        // Draw ball
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);

        // Gradient fill
        const gradient = ctx.createRadialGradient(
          ball.x - 5,
          ball.y - 5,
          0,
          ball.x,
          ball.y,
          ball.radius
        );
        gradient.addColorStop(0, "#FFF8DC");
        gradient.addColorStop(1, ball.color);
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Animation loop
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Update rotation
        hexagonRotation += rotationSpeed * 0.01;

        // Update physics
        updateBall();

        // Draw everything
        drawHexagon();
        drawBall();

        requestAnimationFrame(animate);
      }

      // Control handlers
      document
        .getElementById("rotationSpeed")
        .addEventListener("input", (e) => {
          rotationSpeed = parseFloat(e.target.value);
          document.getElementById("rotationValue").textContent =
            rotationSpeed.toFixed(1);
        });

      document.getElementById("gravity").addEventListener("input", (e) => {
        gravity = parseFloat(e.target.value);
        document.getElementById("gravityValue").textContent =
          gravity.toFixed(2);
      });

      document.getElementById("bounce").addEventListener("input", (e) => {
        bounceFactor = parseFloat(e.target.value);
        document.getElementById("bounceValue").textContent =
          bounceFactor.toFixed(2);
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        ball.x = centerX;
        ball.y = centerY - 100;
        ball.vx = 2;
        ball.vy = 0;
        ball.trail = [];
      });

      // Start animation
      animate();
    </script>
  </body>
</html>
